<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Studs Budge</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <!-- Dynamic Background Canvas -->
    <div class="bg-canvas"></div>

    <div class="auth-container glass-card">
        <!-- Logo -->
        <div class="auth-logo">
            <i class="fa-solid fa-bolt"></i> Studs Budge
        </div>

        <!-- Login Form -->
        <div id="login-view">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to manage your student budget.</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="student@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <div id="login-error" class="auth-error hidden">Invalid email or password.</div>

                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <p class="auth-switch">Don't have an account? <a href="#" onclick="toggleAuthView('register')">Create one</a></p>
        </div>

        <!-- Register Form (Hidden by default) -->
        <div id="register-view" class="hidden">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join to start tracking your money.</p>

            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="student@example.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            
            <p class="auth-switch">Already have an account? <a href="#" onclick="toggleAuthView('login')">Login here</a></p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Account created!</span>
    </div>

    <script src="Script.js"></script>
</body>
</html>
